[package]
name = "cosmic-applet-capslock"
version = "0.1.0"
edition = "2021"

[lib]
name = "cosmic_applet_capslock"
path = "src/lib.rs"

[[bin]]
name = "cosmic-applet-capslock"
path = "src/main.rs"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
] }
fontdb = "0.24"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
